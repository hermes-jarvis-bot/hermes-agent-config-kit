  reason: >
    A plain git `pre-push` hook (not a Claude-Code/Hermes agent-loop hook at all): refuses a
    push whose commit author matches a private "personal marker" address list, chaining to the
    repo's own local pre-push hook afterward. This adapter's own CLAUDE.md non-negotiable
    boundaries state it "has no git-hook-installation mechanism of its own" -- this repo's
    installer/remover scope is explicitly limited to `<hermes-home>/skills/config-kit/` and
    `<hermes-home>/templates/config-kit/` (plus the reviewed-hook copy target), never
    `.git/hooks/`. Reinforces secrets-as-data.md's own public-repo boundary (no policy
    conflict), but is out of this adapter's installation scope by mechanism, not by judgment.
  revisit_condition: >
    Would require this adapter to add a git-hook-installation capability as a new, deliberate
    scope expansion (its own PORTING_BACKLOG.md decision, not a side effect of a hook review) --
    at which point pre-push-public-repo-scan.py below would be the higher-value candidate to
    port first, since it is this repo's own currently enforced pre-push mechanism
    (secrets-as-data.md names it directly).

