- source_repo: AnastasiyaW/claude-code-config
  source_path: hooks/coord-claim-guard.py
  source_sha256: 04b41d1a475390ad49301c6ccae9c725484fd1be4dcc9da3a9a69b8b85990a6
  reviewed_at: "2026-08-10"
  reviewed_by: "operator-directed Wave 4 backlog-reconciliation batch, hermes-agent-config-kit session b45ab3c7 (characterized via a research subagent's full read, findings cross-checked personally against the reported logic before this decision)"
  decision: rejected
  context: >
    Same uncatalogued-hooks audit as conversation-history-capture.py above.
  reason: >
    A pure PreToolUse dispatcher: for any edited file, it walks up the directory tree looking
    for a per-repo `.claude/coord/guard.py` and delegates the entire allow/block decision to
    whatever it finds there. It carries no allow/block logic of its own -- the real logic is
    expected to live in a per-repo file that is not part of the upstream snapshot and has no
    established Hermes-repo convention anywhere in this adapter's research. Porting the
    delegator alone would ship a permanently-inert no-op: every dispatch would fail to find the
    delegate file and silently allow, forever, unless an operator separately wrote AND
    maintained a second, unported file this adapter has no visibility into.
  revisit_condition: >
    Would need a companion convention for what `.hermes/coord/guard.py` (or equivalent) should
    contain and why, established and documented by the operator first -- porting the dispatcher
    before that exists just ships dead code.

- source_repo: AnastasiyaW/claude-code-config
  source_path: hooks/directory-creation-guard.py
  source_sha256: 4282b0980c5e2d0166375666332bd3118035265dd1ca1a57c499a7ed62a0c9c
  reviewed_at: "2026-08-10"
  reviewed_by: "operator-directed Wave 4 backlog-reconciliation batch, hermes-agent-config-kit session b45ab3c7 (fully read personally before this decision -- and independently, personally experienced this exact hook's live behavior earlier in the same session, when it blocked a `mkdir -p` scratchpad command for lacking a .folder-meta.json lifecycle label)"
  decision: rejected
  context: >
    Same uncatalogued-hooks audit as conversation-history-capture.py above. This is the actual
    Claude-Code hook currently installed and active in this working environment (confirmed by
    directly triggering it mid-session, independent of this review).
  reason: >
    Its `main()` calls a genuine PreToolUse `block(...)` -- a hard denial, not an advisory
    stderr print -- on mkdir/New-Item/CreateDirectory calls into scratch/dataset/root-adjacent
    locations lacking a .folder-meta.json lifecycle label. This directly conflicts with this
    adapter's own file-organization-cohesion.md rule, which states explicitly that the
    enforcement mechanism for this exact policy area must be advisory, not a hard rule
    ("Хук — мягкий... не жёсткое правило"), because mkdir is a reversible, harmless action per
    autonomy-risk-tiers.md's own LOW-tier classification ("mkdir/remount... ПРОСТО ДЕЛАЮ, не
    жду"). It is also redundant in intent with file-cohesion-guard.py (Write/Edit-scoped, stderr
    reminder, never blocks) -- porting BOTH would mean this adapter ships two guards for the
    same policy area disagreeing on enforcement strength, and porting only this one would
    mechanically enforce a stance the operator has already rejected for a different, sibling
    hook, on a command class explicitly named reversible in the operator's own rules.
  revisit_condition: >
    Could be reconsidered only as a rewrite matching file-cohesion-guard.py's own advisory
    (stderr-only, never-block) shape -- at which point it would functionally duplicate that
    hook's mkdir-specific coverage rather than add a genuinely new capability, so the stronger
    case is extending file-cohesion-guard.py's own matcher to include mkdir/New-Item, not
    porting this file as a second hook.

- source_repo: AnastasiyaW/claude-code-config
  source_path: hooks/git-source-gate.py
  source_sha256: a0e63a5b8437c37c787aae3c1e8a3c57461967eff04309cc2a7826496db3c90
  reviewed_at: "2026-08-10"
  reviewed_by: "operator-directed Wave 4 backlog-reconciliation batch, hermes-agent-config-kit session b45ab3c7 (characterized via a research subagent's full read, findings cross-checked personally against the reported logic before this decision)"
  decision: rejected
  context: >
    Same uncatalogued-hooks audit as conversation-history-capture.py above.
  reason: >
    A Stop-event hook that BLOCKS session end when a long-run project (feature_list.json
    present) is not a git repo, or has no `origin` remote -- genuinely enforcing
    git-source-of-truth.md's own principle, which this adapter shares. Rejected purely on
    mechanism: Hermes has no Stop-equivalent event whose return value is honoured.
    `on_session_end` fires every turn but Hermes discards its return value entirely (verified
    against agent/turn_finalizer.py -- same gap already documented for verify-deleted-guard.py/
    over-engineering-advisor.py/backup-retention-cleanup.py). A ported version could run the
    same check and print a loud stderr warning, but could never actually block the session from
    ending, which is this hook's entire reason to exist. Not a policy conflict -- there is
    simply no Hermes channel that does what this hook needs to do.
  revisit_condition: >
    Would need Hermes to expose a genuinely blocking session-end-class event (verified against
    live source, not assumed) before a faithful port is possible. An advisory-only variant could
    be written today, but that is a materially weaker hook than what this entry describes, and
    should be evaluated as its own decision if the operator wants it despite the gap.

