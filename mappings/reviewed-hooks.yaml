    injects a listing so the model can offer to continue. Reimplemented from the upstream
    SessionStart hook onto Hermes's `pre_llm_call` event filtered by `extra.is_first_turn`,
    NOT `on_session_start` -- verified against the live agent/turn_context.py source that
    `on_session_start`'s return value is discarded by its only caller (same fire-and-forget
