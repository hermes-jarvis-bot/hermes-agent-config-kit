# Reviewed-hook lane (see SECURITY.md "Reviewed-hook lane" for the full policy this
# manifest implements, and PORTING_BACKLOG.md's "Wave 4" section for how a Wave-4 guard
# earns its acceptance criteria).
#
# Unlike the reviewed-script lane (mappings/reviewed-scripts.yaml), a hook here is NEVER
# byte-identical to its upstream source: Hermes's shell-hook I/O contract differs from
# Claude Code's in ways that require a real reimplementation, not a copy-paste — different
# tool names (terminal/read_file/write_file/patch, not Bash/Read/Write/Edit), the
# Hermes-canonical block-JSON shape ({"action":"block","message":...}), and critically:
# Hermes never blocks on exit code, only on a stdout JSON decision (verified 2026-08-07
# against the live agent/shell_hooks.py source and
# https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks).
#
# Every entry here required, before being added:
#   1. a full manual read of the entire upstream source hook (not a grep-only pass);
#   2. a Hermes-native reimplementation — decision logic carried over, I/O contract
#      translated deliberately (documented in the file's own header and this entry's
#      `summary`);
#   3. a dependency check (stdlib only — no external packages for a guard hook);
#   4. confirmation of no destructive filesystem operation, no credential/secret reads or
#      logging beyond what the guard's own logic needs, and no undisclosed network call;
#   5. a policy-conflict check against this kit's own already-ported operator-facing
#      guidance (e.g. a guard that blocks reading secret files would conflict with a
#      secrets-as-data-style policy if this kit ever ports one — checked before accepting);
#   6. `python3 -m py_compile` passing cleanly;
#   7. this repo's own automated dangerous-pattern and secret scans
#      (validate_reviewed_hooks() in scripts/validate_output.py) passing cleanly;
#   8. functional verification against Hermes's real hook-dispatch code path
#      (agent.shell_hooks.run_once), on an isolated ShellHookSpec object that never reads
#      or writes ~/.hermes/config.yaml or the shell-hooks allowlist — recorded below;
#   9. never auto-registered into ~/.hermes/config.yaml by this adapter's installer: the
#      installer only copies the script file (see scripts/install_hermes.py); wiring the
#      hooks: entry into config.yaml remains an explicit, operator-performed step,
#      documented in hermes/hooks/README.md.
#
# `files` lists every path that belongs to this hook's package (the guard script, its
# shared common module if not already listed under a separate entry, and any
# non-executable documentation/test file bundled alongside it) — all of them are exempted
# from the quarantine-leak check together, but only `.py` files are run through the
# dangerous-pattern/marker checks in validate_reviewed_hooks().

- path: hermes/hooks/hermes_hook_common.py
  source_repo: AnastasiyaW/claude-code-config
  source_path: hooks/safety_common.py
  source_sha256: 1c4823c06984e767d19a0363361b3374875a56ac305d9eb6471350b727acbb18
  reviewed_at: "2026-08-07"
  reviewed_by: "operator-directed Wave 4 prototype, hermes-agent-config-kit session b45ab3c7"
  summary: >
    Shared I/O-contract adapter, reimplemented (not copied) from
    hooks/safety_common.py for Hermes's shell-hook wire protocol. stdlib only
    (json, os, re, sys, datetime, pathlib). No network calls, no
    subprocess/os.system/eval/exec, no destructive filesystem operations.
    Read from stdin, appends only to its own JSONL audit log under
    ~/.hermes/logs/. Deliberate translations from the upstream module: log
    path (~/.claude/logs -> ~/.hermes/logs), block() emits
    {"action":"block","message":...} (Hermes-canonical) instead of
    {"decision":"block","reason":...} (both are accepted by Hermes, but the
    canonical shape needs no internal translation), bypass env-var prefix
    (HERMES_ALLOW_* not CLAUDE_ALLOW_*) and in-command marker
    (# hermes-bypass: not # claude-bypass:). The upstream Stop-hook rejection
    budget (stop_hook_active loop guard) was NOT ported: Hermes's pre_verify
    event does not have the same re-invocation-loop shape, so the mechanism
    it exists to guard against does not apply here.
  functional_test: >
    See the destructive-command-guard.py entry below — this module has no
    independent entry point, so it is exercised only through that guard's
    tests.

- path: hermes/hooks/destructive-command-guard.py
  source_repo: AnastasiyaW/claude-code-config
  source_path: hooks/destructive-command-guard.py
  source_sha256: 51f39f0cc4edec5ef6a2965c25bc47bf95958b9b073adebb23496ac62d1b95e7
  reviewed_at: "2026-08-07"
  reviewed_by: "operator-directed Wave 4 prototype, hermes-agent-config-kit session b45ab3c7"
  summary: >
    Blocks catastrophically destructive shell commands (rm -rf on
    root/home/wildcards, DROP/TRUNCATE without WHERE, kubectl delete --all,
    docker prune --volumes, mkfs/dd on a block device, fork bomb) on the
    `terminal` tool. Decision logic (the regex pattern list) is carried over
    unchanged from upstream — it is harness-agnostic. Only the I/O contract
    was translated: tool_name check is "terminal" not "Bash" (Hermes's
    tool-name for shell execution, confirmed against
    https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks),
    and it uses hermes_hook_common instead of safety_common. stdlib only
    (re, sys, pathlib). No network calls, no subprocess/os.system/eval/exec,
    no destructive filesystem operations of its own. Not policy-conflicting
    with any already-ported skill in this kit (checked against
    autonomy-risk-tiers/deletion-confirm-and-verify — this guard's stance
    "destructive+irreversible -> block, confirm, or explicit bypass" matches
    those already-ported modules' own stance, unlike the sibling
    secret-leak-guard.py, which was reviewed and NOT ported this pass because
    it would conflict with this operator's own secrets-as-data policy).
  functional_test: >
    Verified 2026-08-07 against Hermes's real dispatch code path
    (agent.shell_hooks.run_once, /usr/local/lib/hermes-agent, Hermes Agent
    v0.19.0) using an isolated ShellHookSpec that never touched
    ~/.hermes/config.yaml or the shell-hooks allowlist. 8/8 functional cases
    passed (benign command allowed; rm -rf /, rm -rf ~, DROP TABLE, kubectl
    delete --all all blocked; a `# hermes-bypass: destructive` marker
    allowed; a non-`terminal` tool call allowed; an unprotected rm -rf on a
    project-local path allowed). A separate targeted regression test (3/3
    passed) confirmed the load-bearing invariant this whole reimplementation
    depends on: exit 2 + stderr with no stdout JSON does NOT block under
    Hermes (unlike Claude Code), and exit 1 WITH a valid block JSON on
    stdout still blocks (exit code is irrelevant to Hermes's decision).
  files:
    - hermes/hooks/README.md
    - hermes/hooks/README_RU.md
    - hermes/hooks/tests/test_destructive_command_guard.py

- path: hermes/hooks/git-destructive-guard.py
  source_repo: AnastasiyaW/claude-code-config
  source_path: hooks/git-destructive-guard.py
  source_sha256: 5844a7dca375fb603c94a6ea6f3954c2654de7380c48c370df0573ad88dc41b1
  reviewed_at: "2026-08-07"
  reviewed_by: "operator-directed Wave 4 continuation, hermes-agent-config-kit session b45ab3c7"
  summary: >
    Blocks destructive git operations (reset --hard, push --force,
    branch -D, clean -fdx, checkout -- ., filter-branch/filter-repo,
    deleting a main/master/production ref, interactive rebase of HEAD,
    aggressive reflog/gc expiry) on the `terminal` tool. Decision logic
    (the regex pattern list, including the deliberate case-sensitive
    -D vs -d distinction) carried over unchanged from upstream —
    harness-agnostic. Only the I/O contract was translated (tool name,
    hermes_hook_common instead of safety_common, HERMES_ALLOW_* instead
    of CLAUDE_ALLOW_*). stdlib only (re, sys, pathlib). No network
    calls, no subprocess/os.system/eval/exec, no destructive filesystem
    operations of its own. Not policy-conflicting: this operator's own
    global git-source-of-truth.md rule already states an equivalent
    "never run destructive git commands... unless explicitly requested"
    protocol naming the exact same commands (push --force, reset --hard,
    checkout ., restore ., clean -f, branch -D) — this hook mechanically
    enforces a policy this operator already holds, unlike the rejected
    secret-leak-guard.py.
  functional_test: >
    Verified 2026-08-07 two ways. (1) stdlib-only subprocess test
    (hermes/hooks/tests/test_git_destructive_guard.py, runs in CI):
    10/10 cases passed (benign git status allowed; reset --hard,
    push --force, branch -D, clean -fdx, filter-branch all blocked;
    push --force-with-lease and branch -d, the recommended safe
    alternatives, both allowed; bypass marker allowed; non-terminal
    tool call allowed). (2) Direct verification against Hermes's real
    dispatch code path (agent.shell_hooks.run_once, Hermes Agent
    v0.19.0) using an isolated ShellHookSpec that never touched
    ~/.hermes/config.yaml or the shell-hooks allowlist: 5/5 cases
    passed, including the same exit-code-never-blocks regression check
    established for destructive-command-guard.py (exit 2 with no
    stdout JSON does not block).
  files:
    - hermes/hooks/tests/test_git_destructive_guard.py

- path: hermes/hooks/self-harm-guard.py
  source_repo: AnastasiyaW/claude-code-config
  source_path: hooks/self-harm-guard.py
  source_sha256: 76e9c963c8619fc0bd5bd5cfc08857ff5b4a4ec3d7723ed2e9ccd42cd10bc18a
  reviewed_at: "2026-08-08"
  reviewed_by: "operator-directed Wave 4 continuation, hermes-agent-config-kit session b45ab3c7"
  summary: >
    Blocks commands that could cut the agent off from its own host: sshd
    config edits/restart/kill, killing the agent's own runtime process
    (pkill/killall), iptables/ufw rules that drop its own connectivity,
    and reboot/shutdown without a handoff. Decision logic (the regex
    pattern list) carried over unchanged from upstream for the OS-level
    concerns (SSH, firewall, reboot — these are vendor-neutral by
    nature). The process-kill patterns were adapted with a live check,
    not a guess: `ps aux` on this actual environment confirmed the
    running Hermes gateway process is `python -m hermes_cli.main
    gateway run` — shows as a bare `python` process, already covered
    by upstream's own killall pattern. Renamed the Claude-specific
    process/package identifiers (`claude`, `@anthropic`, `claude-code`)
    to their Hermes equivalents (`hermes`, `hermes_cli`, `hermes-agent`,
    `nousresearch`) in the killall/pkill -f patterns; kept `node`/`bun`
    since Hermes's desktop/web components use them too. Tool-name
    checks translated (Bash->terminal, Edit/Write->patch/write_file,
    matching the file-write tool-name mapping established for the
    read/write file operations). stdlib only (re, sys, pathlib). No
    network calls, no subprocess/os.system/eval/exec, no destructive
    filesystem operations of its own. Not policy-conflicting — this is
    a defensive guard against losing access to one's own host, which no
    existing operator policy argues against.
  functional_test: >
    Verified 2026-08-08 two ways. (1) stdlib-only subprocess test
    (hermes/hooks/tests/test_self_harm_guard.py, runs in CI): 12/12
    cases passed (benign command allowed; sshd restart, pkill sshd,
    killall python, pkill -f hermes_cli, ufw default-deny, bare reboot,
    sshd_config write_file, authorized_keys patch all blocked; reboot
    mentioned inside a grep allowed; bypass marker allowed; a
    non-matching tool call allowed). (2) Direct verification against
    Hermes's real dispatch code path (agent.shell_hooks.run_once,
    Hermes Agent v0.19.0) using an isolated ShellHookSpec that never
    touched ~/.hermes/config.yaml or the shell-hooks allowlist: all
    cases passed, including a repeat of the exit-code-never-blocks
    regression check.
  files:
    - hermes/hooks/tests/test_self_harm_guard.py

- path: hermes/hooks/command-injection-guard.py
  source_repo: AnastasiyaW/claude-code-config
  source_path: hooks/command-injection-guard.py
  source_sha256: cc0d2d231dcb3d517702874fdde23196fe308c096ec6d34f9b045a93e72db3fd
  reviewed_at: "2026-08-08"
  reviewed_by: "operator-directed Wave 4 continuation, hermes-agent-config-kit session b45ab3c7"
  summary: >
    Detects a shell-substitution injection class: text intended as data
    (e.g. an argument to `gh issue create --body`) that actually
    executes as a command because of `$(...)`/backtick substitution
    evaluating before the outer command sees it. Distinguishes trivial,
    side-effect-free substitutions (pwd, date, git rev-parse, etc.) from
    ones containing a destructive verb (hard block) from other
    non-trivial ones (advisory block requiring confirmation). Decision
    logic (the trivial-command allowlist, the destructive-verb regex,
    the substitution-finding logic including the single-quote-literal
    exclusion) carried over completely unchanged from upstream — every
    piece of it is harness-agnostic string/regex analysis with no
    Claude-Code-specific naming anywhere in the original file. Only the
    I/O contract was translated (tool name terminal not Bash,
    hermes_hook_common instead of safety_common, HERMES_ALLOW_INJECTION
    instead of CLAUDE_ALLOW_INJECTION). stdlib only (re, sys, pathlib).
    No network calls, no subprocess/os.system/eval/exec, no destructive
    filesystem operations of its own. Not policy-conflicting — this
    operator's own live environment already runs an equivalent guard:
    its exact block-message wording ("Non-trivial shell
    substitution... Подтверди... CLAUDE_ALLOW_INJECTION=1") was
    encountered verbatim as a live PreToolUse block multiple times
    earlier in this same session, confirming this exact guard (or a
    close sibling) is already a working, valued part of this
    operator's own Claude Code setup.
  functional_test: >
    Verified 2026-08-08 two ways. (1) stdlib-only subprocess test
    (hermes/hooks/tests/test_command_injection_guard.py, runs in CI):
    9/9 cases passed (benign command and trivial substitutions
    $(pwd)/$(git rev-parse HEAD) allowed; a dropdb smuggled via $() and
    an rm -rf smuggled via $() both hard-blocked; a non-trivial-but-not-
    destructive $(curl ...) advisory-blocked; a literal $() inside
    single quotes allowed as non-executing; bypass marker allowed; a
    non-matching tool call allowed). (2) Direct verification against
    Hermes's real dispatch code path (agent.shell_hooks.run_once,
    Hermes Agent v0.19.0) using an isolated ShellHookSpec that never
    touched ~/.hermes/config.yaml or the shell-hooks allowlist: all
    cases passed, including a repeat of the exit-code-never-blocks
    regression check.
  files:
    - hermes/hooks/tests/test_command_injection_guard.py
