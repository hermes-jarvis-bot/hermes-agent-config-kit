    dual-registration design as session-handoff-reminder.py (pre_verify for a genuine live
    block, on_session_end as the audit-log fallback), and the same underlying reason: no
    single Hermes event fires on every turn-end attempt the way Claude Code's Stop does.
    OPERATOR-APPROVED DESIGN (2026-08-09), presented and accepted before implementing: unlike
    session-handoff-reminder.py (fires once per session), this hook is willing to fire on
    every eligible turn while the KB stays broken, sharing Hermes's session-wide 3-nudge
    pre_verify budget with session-handoff-reminder.py and any other consumer -- in the rare
    worst case (KB genuinely broken AND a long session with no fresh handoff, on overlapping
    turns) this hook could consume the whole shared budget and starve the other hook's live
    nudge for the rest of that session. Both are still dual-registered with on_session_end, so
    neither is ever silently lost entirely -- worst case is losing the LIVE nudge for one
    session, not the audit-log entry. The evaluate()/`_run_validator()`/self-test logic
    carried over unchanged -- harness-agnostic. Dropped upstream's own per-hook-name anti-loop
    budget (`stop_hook_active`/`stop_budget_consume`/`stop_budget_exhausted` from
    safety_common.py) as redundant: Hermes's own session-wide `attempt`/`max_verify_nudges()`
    cap already serves the identical purpose (same reasoning already applied when the shared
    hermes_hook_common.py module was first ported). Kept `untrusted_block()` (promoted from a
    one-off helper into hermes_hook_common.py, since it is a generically reusable safety
    practice, not specific to this hook) -- the repo's own validate_kb.py stdout lands in the
    model's context as a block message, so it is framed as data, not instructions.
    CLAUDE_SKIP_KB_GATE -> HERMES_SKIP_KB_GATE, .claude/.skip-kb-gate -> .hermes/.skip-kb-gate.
  functional_test: >
