    Wave-4 hook so far where the "right event" fix alone recovers full upstream capability --
    no audit-log-only downgrade needed. Adapted: dropped the upstream `source` field
    (startup/resume/clear/compact distinction) since Hermes exposes no compaction-boundary
    hook or flag at all -- every is_first_turn=True is treated uniformly as a fresh start,
    documented `# simplification:` in the file; dropped cross-hook marker resets
