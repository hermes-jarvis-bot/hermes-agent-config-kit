    hooks/safety_common.py for Hermes's shell-hook wire protocol. stdlib only
    (json, os, re, sys, datetime, pathlib). No network calls, no
    subprocess/os.system/eval/exec, no destructive filesystem operations.
    Read from stdin, appends only to its own JSONL audit log under
    ~/.hermes/logs/. Deliberate translations from the upstream module: log
    path (~/.claude/logs -> ~/.hermes/logs), block() emits
