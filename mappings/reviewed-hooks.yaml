    reviewed hook, so it was switched to the equivalent argv-list form (no behavior change:
    every branch is a hardcoded arg list, never built from the destructive command's own
    content). Otherwise unchanged -- harness-agnostic. Adapted: tool_name check "terminal"
    not "Bash"; upstream's `interrupted` skip-check (Claude-Code-specific field, no Hermes
    equivalent) replaced with `extra.status == "blocked"` (the real Hermes analog of "this
    call never executed" -- a non-zero exit deliberately does NOT skip verification, since a
    partial failure is exactly what this hook exists to catch).
    Updated 2026-08-09: upstream added `verify_move()` (mv, PowerShell `Move-Item`, `robocopy
    /move`) in a routine sync (PR #27, no drift in the 4 functions already ported) -- carried
    over unchanged, same harness-agnostic regex+filesystem shape as the other verifiers, plus
    a matching dispatch entry.
    IMPORTANT CAPABILITY GAP (verified against the live model_tools.py/agent/shell_hooks.py
    source): Hermes's post_tool_call is a fire-and-forget observer hook --
    `_emit_post_tool_call_hook()` calls `invoke_hook("post_tool_call", ...)` and discards its
    return value, so nothing this script prints reaches the model's context in this turn or
    the next (unlike Claude Code's PostToolUse, whose stderr is surfaced back into the same
    agent turn). Ported anyway, by explicit operator decision, as an audit-log-only guard:
    every verdict lands in the shared safety log (hermes_hook_common.log()), durable and
    operator-inspectable, but there is no live in-turn nudge. Revisit if a future Hermes
    version adds a context-injection path for post_tool_call.
