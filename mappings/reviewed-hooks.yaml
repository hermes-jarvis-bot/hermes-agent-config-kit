    pre_llm_call event with the calling process actually chdir'd into the sandbox (required --
    Hermes's _serialize_payload always uses the live process cwd, not a kwarg override) that
    never touched ~/.hermes/config.yaml or the shell-hooks allowlist: confirmed a real handoff
    file produces a genuine, non-null parsed {"context": ...}, and that two different
