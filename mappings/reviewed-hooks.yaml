    turn-end attempt regardless of what happened that turn -- verified against the live
    agent/conversation_loop.py and agent/turn_finalizer.py source that the two closest events
    have complementary, individually incomplete coverage: `pre_verify` gives a genuine live
    nudge (its {"action":"continue","message":...} return reaches the model via
    get_pre_verify_continue_message(), the exact mechanism that produced this operator's own
    live "Stop hook feedback" text earlier this session) but is only checked when the agent
    edited a file THIS turn and a session-wide 3-nudge budget (shared with any other
    pre_verify consumer) isn't exhausted; `on_session_end` fires on every turn regardless of
    edits, matching upstream's actual trigger frequency far better, but its return value is
    discarded (same fire-and-forget pattern as post_tool_call), so it can only log.
    OPERATOR-APPROVED DESIGN: dual registration on both events, one script branching on
    `hook_event_name`. `on_session_end` is the reliable audit-log fallback covering every
    long session, coding or not; `pre_verify` is a bonus live nudge on the turns where its
    narrow gate holds. Both share the same age/freshness check and the same
    `.hermes/.handoff-reminded` marker, so whichever fires first in a turn suppresses the
    other for the rest of the session. Adapted: dropped the upstream `.claude/HANDOFF.md`
    legacy single-file format (documented `# simplification:` -- fresh adaptation, no legacy
    baggage); same Hermes-native handoff-directory default as session-handoff-check.py.
    SESSION_MIN_MINUTES/HANDOFF_STALE_MINUTES tunables carried over unchanged from upstream.
  functional_test: >
    Verified 2026-08-09 two ways. (1) stdlib-only subprocess test
    (hermes/hooks/tests/test_session_handoff_reminder.py, runs in CI): 8/8 cases passed (wrong
    event silent; no .hermes dir silent; first call touches the session marker with no
    reminder; session too young silent; old-enough-with-no-fresh-handoff via pre_verify
    produces a live nudge on stdout and sets the reminded marker; already-reminded silent;
    the same condition via on_session_end logs to stderr only, no stdout; a fresh handoff on
    disk silences the reminder despite an old session). (2) Direct verification against
    Hermes's real dispatch code path (agent.shell_hooks.run_once, Hermes Agent v0.19.0) using
    an isolated ShellHookSpec on both the pre_verify and on_session_end events, calling
    process chdir'd into the sandbox, that never touched ~/.hermes/config.yaml or the
    shell-hooks allowlist: confirmed pre_verify genuinely returns a non-null
    {"action":"continue",...} while on_session_end always parses to None regardless of
    content -- empirically proving both halves of the dual-registration design, not just
    reading the source -- plus a repeat of the exit-code-never-blocks regression check.
  files:
    - hermes/hooks/tests/test_session_handoff_reminder.py

