    checklist text, the workflow-path matcher, the 10%-chance stale-state cleanup. Adapted:
    `Write`/`Edit`/`MultiEdit` -> Hermes's `write_file`/`patch` (no separate MultiEdit tool
    exists); per-session "already shown" state moved from a flat
    `~/.claude/logs/github_workflow_warnings_<session>.json` file to
    `.hermes/sessions/<session_id>/github-workflow-warnings.json`, matching this adapter's
    established session-scoped-state convention (see transfer-contract-guard.py's docstring for
    the project-scoped-vs-session-scoped bug class this adapter fixes on sight); toggle env var
    renamed from upstream's bespoke `ENABLE_GH_WORKFLOW_SECURITY=0` to
    `HERMES_ALLOW_GH_WORKFLOW_SECURITY=1`, matching this adapter's other bypass-naming
    convention rather than introducing a second toggle shape.
