    subsequent edits of the SAME file in the SAME session are advisory only (stderr, never
    blocks again). Extracted by upstream from anthropics/claude-plugins-official's
    security-guidance plugin; deliberately narrow in scope for the same reason upstream gives --
    this adapter's other guards already cover secrets/destructive/injection, and a generic
