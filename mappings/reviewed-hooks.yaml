    its own still-unfixed session-handoff-check.py/session-handoff-reminder.py pair -- not
    something this port introduced, faithfully carried over, but fixed here by operator
    decision. Fix: both markers moved under `.hermes/sessions/<session_id>/`, and every call
    now also touches a shared heartbeat (`hermes_hook_common.touch_session_heartbeat()`) --
    since `pre_llm_call` fires every turn (not just is_first_turn), this hook is a natural,
    already-happening heartbeat producer for transfer-contract-guard.py's own liveness checks.
