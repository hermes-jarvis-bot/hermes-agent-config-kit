    backup tooling installed must not be locked out of legitimate destructive work.
    Ported unchanged: all 3 engine-specific try/verify function pairs, the destructive-pattern
    regex list, the size/footer/statement verification heuristics. Adapted: tool_name check
    "terminal" not "Bash"; bypass via hermes_hook_common.bypass("db-snapshot") (auto-derives
    HERMES_ALLOW_DB_SNAPSHOT, matching this adapter's existing bypass-naming convention) instead
    of upstream's manually-spelled CLAUDE_ALLOW_DB_SNAPSHOT; log() calls use this adapter's
    shared JSONL audit log instead of upstream's safety.log.
