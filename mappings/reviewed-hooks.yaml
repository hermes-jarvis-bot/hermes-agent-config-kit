- path: hermes/hooks/transfer-contract-guard.py
  source_repo: AnastasiyaW/claude-code-config
  source_path: hooks/transfer-contract-guard.py
  source_sha256: c97c5c5dab3c4ae65096e7bd8638749a12350dd188474f4fd3c6fbe277221857
  reviewed_at: "2026-08-10"
  reviewed_by: "operator-directed Wave 4 continuation after upstream sync PR #27, hermes-agent-config-kit session b45ab3c7 (fully read personally before this decision)"
  summary: >
    Guards clone/copy/move/sync commands with a durable, handoff-friendly JSON contract
    (see templates/transfer-contract.json's Hermes-native copy) recording source, destination,
    verification plan, and source-cleanup intent -- so a second agent can resume from one small
    record instead of reconstructing intent from shell history. New upstream feature discovered
    via a manual upstream-watch dispatch (upstream had drifted since the last sync; PR #27
    merged first). The single upstream file spans all three Hermes-adaptation patterns already
    established in this repo, each verified individually rather than assumed to carry over:
    - `pre_tool_call` -- genuinely blocks a transfer command through `terminal` without a
      complete `# transfer-contract: <path>.json` marker, same mechanism as
      destructive-command-guard.py etc.
    - `post_tool_call` -- audit-log-only (Hermes discards this event's return value, same
      verified gap as verify-deleted-guard.py/over-engineering-advisor.py). Reminds to update
      the contract and verify the destination in the shared safety log + stderr, not live.
    - `pre_verify` + `on_session_end`, dual-registered like session-handoff-reminder.py and
      kb-validate-gate.py -- `pre_verify` gives a genuine live block while an open or invalid
      contract remains (gated on file-edit turns and the session-wide 3-nudge budget, now
      shared with THREE consumers: session-handoff-reminder.py, kb-validate-gate.py, and this
      hook); `on_session_end` is the audit-log fallback firing every turn regardless.
    All contract-validation logic (`_contract_errors()`, `_transfer_kind()` detection,
    `_verified_path_errors()`) carried over unchanged -- harness-agnostic. Adapted: tool_name
    check "terminal" not "{Bash, PowerShell}" (Hermes has one unified shell tool); directory
    recognition extended from `.claude/.agent/.codex` to also include `.hermes/transfers/` as
    the Hermes-native default, keeping the other three for cross-harness compatibility (a
    contract written by another harness working the same repo is still enforced); `main()`'s
    dispatch simplified to Hermes's always-explicit `hook_event_name` field, dropping upstream's
    Claude-Code-specific fallback heuristics (`not tool and "transcript_path" in event`,
    `"tool_response" in event`) that exist only because Claude Code hook events don't always
    cleanly self-identify -- Hermes's wire protocol always does.
    OPERATOR-APPROVED DESIGN (2026-08-09, extends the kb-validate-gate.py decision): accepted
    that this hook's Stop-equivalent portion becomes a third consumer of the shared 3-nudge
    pre_verify budget. Same mitigation already in place: dual-registered with on_session_end,
    so nothing is ever silently lost, just possibly not surfaced live in a session where all
    three hooks would otherwise want to speak.
    Updated 2026-08-10: ported an upstream fix that landed within hours of the initial port --
    upstream found that one shared `transfers/` directory meant one session's open transfer
    blocked every OTHER session's Stop attempt too (collateral, since one project can have
    several concurrent agent sessions). Fix: the first pre_tool_call use of a contract stamps
    its `session_id`; at the Stop-equivalent gate, an open contract owned by a DIFFERENT,
    still-live session is deferred (stderr note only) instead of blocked -- only unowned,
    own-session, or stale (owner inactive past the TTL) contracts still block. Adapted rather
    than copied: Hermes's `event.get("session_id")` is always populated (no fallback-chain
    needed, unlike upstream's session_id/sessionId/conversation_id/transcript_path lookup), and
    liveness is checked via a new shared heartbeat mechanism
    (`hermes_hook_common.touch_session_heartbeat()`/`session_is_live()`, a
    `.hermes/sessions/<id>/heartbeat` file) rather than upstream's per-session transcript-file
    mtime, since Hermes has no direct equivalent to Claude Code's
    `~/.claude/projects/<slug>/<session-id>.jsonl`. This same heartbeat mechanism was also
    added to session-handoff-check.py/session-handoff-reminder.py to fix an equivalent,
    previously-undetected collision in THEIR own project-scoped (not session-scoped) marker
    files -- found while reviewing this exact upstream fix, confirmed present in upstream's own
    still-unfixed pair too, and fixed here by operator decision (see those two hooks' own
    manifest entries and hermes_hook_common.py's entry for `touch_session_heartbeat`/
    `session_is_live`/`event_session_id`). Carried over the upstream `--self-test` mode
    (adapted to use the heartbeat mechanism instead of transcript files) verbatim in spirit.
  functional_test: >
    Verified 2026-08-09 two ways, re-verified 2026-08-10 after the session-ownership fix
    (18/18, up from 12/12). (1) stdlib-only subprocess test
    (hermes/hooks/tests/test_transfer_contract_guard.py, runs in CI): 18/18 cases passed,
    covering all three event registrations plus 6 new ownership cases (an open contract owned
    by a never-heartbeat session still blocks; owned by a live foreign session defers instead
    of blocking, on both pre_verify and on_session_end; the same contract blocks again once the
    owner's heartbeat goes stale; a session's own open contract always blocks it regardless of
    its own liveness; the hook's own `--self-test` mode passes). Two test-authoring bugs found
    and fixed before the suite passed clean: a contract fixture using operation.kind="copy"
    against an `rsync` command (which `_transfer_kind()` detects as "sync", not "copy") and a
    "no transfers dir" case that reused a temp dir already populated with contracts from an
    earlier case in the same suite. (2) Direct verification against Hermes's real dispatch
    code path (agent.shell_hooks.run_once, Hermes Agent v0.19.0) using isolated ShellHookSpec
    objects on all four events, calling process chdir'd into a sandbox, that never touched
    ~/.hermes/config.yaml or the shell-hooks allowlist: confirmed pre_tool_call genuinely
    blocks, post_tool_call/on_session_end always parse to None regardless of content,
    pre_verify genuinely returns a non-null {"action":"continue",...}, and -- the ownership fix
    specifically -- a session's own real dispatch call is blocked by its own open transfer
    while a DIFFERENT session's real dispatch call to the same repo, same open transfer, is
    NOT blocked once the owning session's heartbeat is live, plus a repeat of the
    exit-code-never-blocks regression check.
  files:
    - hermes/hooks/tests/test_transfer_contract_guard.py

- path: hermes/hooks/db-snapshot-guard.py
