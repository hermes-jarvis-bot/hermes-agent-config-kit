- path: hermes/hooks/session-handoff-reminder.py
  source_repo: AnastasiyaW/claude-code-config
  source_path: hooks/session-handoff-reminder.py
  source_sha256: 1d23759138898bf92094991d75f30d8f7ae72cd2487996ac91bff367c3309070
  reviewed_at: "2026-08-09"
  reviewed_by: "operator-directed Wave 4 continuation, hermes-agent-config-kit session b45ab3c7 (fully read personally before this decision)"
  summary: >
    Reminds to write a handoff when closing a long session with none fresh on disk.
    Reimplemented from the upstream Stop hook. Hermes has no Stop-equivalent firing on every
    turn-end attempt regardless of what happened that turn -- verified against the live
    agent/conversation_loop.py and agent/turn_finalizer.py source that the two closest events
    have complementary, individually incomplete coverage: `pre_verify` gives a genuine live
    nudge (its {"action":"continue","message":...} return reaches the model via
    get_pre_verify_continue_message(), the exact mechanism that produced this operator's own
    live "Stop hook feedback" text earlier this session) but is only checked when the agent
    edited a file THIS turn and a session-wide 3-nudge budget (shared with any other
    pre_verify consumer) isn't exhausted; `on_session_end` fires on every turn regardless of
    edits, matching upstream's actual trigger frequency far better, but its return value is
    discarded (same fire-and-forget pattern as post_tool_call), so it can only log.
    OPERATOR-APPROVED DESIGN: dual registration on both events, one script branching on
    `hook_event_name`. `on_session_end` is the reliable audit-log fallback covering every
    long session, coding or not; `pre_verify` is a bonus live nudge on the turns where its
    narrow gate holds. Both share the same age/freshness check and the same `handoff-reminded`
    marker, so whichever fires first in a turn suppresses the other for the rest of the
    session. Adapted: dropped the upstream `.claude/HANDOFF.md` legacy single-file format
    (documented `# simplification:` -- fresh adaptation, no legacy baggage); same Hermes-native
    handoff-directory default as session-handoff-check.py.
    SESSION_MIN_MINUTES/HANDOFF_STALE_MINUTES tunables carried over unchanged from upstream.
    Updated 2026-08-10: same project-scoped-not-session-scoped marker collision found and fixed
    as session-handoff-check.py (see that hook's entry for the full finding) -- markers moved
    under `.hermes/sessions/<session_id>/`, and every call now also touches the shared
    heartbeat, since both `pre_verify` and `on_session_end` fire on most/every turn, making
    this hook a second natural heartbeat producer.
  functional_test: >
    Verified 2026-08-09 two ways, re-verified 2026-08-10 after the session-scoping fix (10/10,
    up from 8/8). (1) stdlib-only subprocess test
    (hermes/hooks/tests/test_session_handoff_reminder.py, runs in CI): 10/10 cases passed
    (wrong event silent; no .hermes dir silent; first call touches the session-scoped marker
    and heartbeat with no reminder; session too young silent; old-enough-with-no-fresh-handoff
