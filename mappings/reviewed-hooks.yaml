- path: hermes/hooks/repeated-attempt-guard.py
  source_repo: AnastasiyaW/claude-code-config
  source_path: hooks/repeated-attempt-guard.py
  source_sha256: 34193960f695d73e6c128f9d72c0229fbd0eeb6e4682d5eaa05ae41fc987106
  reviewed_at: "2026-08-10"
  reviewed_by: "operator-directed Wave 4 backlog-reconciliation batch, hermes-agent-config-kit session b45ab3c7 (fully read personally before this decision, including verifying against live Hermes source that post_tool_call's extra payload genuinely carries a derived status/error_type field before committing to this port -- see model_tools.py's _emit_post_tool_call_hook/_tool_result_observer_fields)"
  summary: >
    Dual-registered post_tool_call (records outcomes) + pre_tool_call (reads the record,
    decides): stops the guess-and-retry loop where an agent varies the surface of the same
    failing command/file four times without reading anything in between. Advisory at 2 prior
    failures, blocks the 4th attempt at 3 prior failures with nothing read since the last one --
    a single read (of anything) clears the block. Ported unchanged: the target-key derivation
    (flags dropped, arguments kept, a leading directory-change token preserved as context so two
    projects running the same command don't collide), the failure-window/consultation-since-
    last-failure logic, the upstream `--self-test` (extended with 3 more cases for the
    Hermes-specific tool-name/status changes below). Adapted: tool-name sets translated to
    Hermes's actual registry (ACTING = {terminal, write_file, patch}; CONSULTING = {read_file,
    search_files} -- no separate MultiEdit/Grep/Glob tools exist; CONSULTING matches Hermes's
    own internal `_READ_SEARCH_TOOLS` grouping in model_tools.py, not a guessed set); `failed()`
    reads Hermes's own already-derived `extra.status == "error"` instead of re-parsing a raw
    result blob, since Hermes computes this once per call and hands it to every post_tool_call
    listener -- verified this field is actually present before porting, not assumed; state path
    under `~/.hermes/state/` (HERMES_RETRY_STATE override); block verdict via
    hermes_hook_common.block() (Hermes-canonical shape) instead of upstream's Claude-Code-style
    decision/reason dict.
  functional_test: >
    (1) The hook's own `--self-test` (18 cases, extended from upstream's 15 for the Hermes
    tool-name/status adaptations), all passing. (2) hermes/hooks/tests/test_repeated_attempt_guard.py,
    7/7 cases, using HERMES_RETRY_STATE pointed at an isolated tempfile (never touches the real
    state path): a clean target is allowed silently; 2 failures produce an advisory on stderr,
    not a block; 3 failures with nothing read block the 4th attempt with a genuine
    `{"action":"block",...}` response; a read since the last failure clears the block; the
    global retry-loop bypass env var suppresses the guard entirely. (3) Direct verification
    against Hermes's real dispatch code path (agent.shell_hooks.run_once): 3 real post_tool_call
    dispatches with a genuine error status followed by a real pre_tool_call dispatch confirmed a
    genuine block response through the exact _spawn/_parse_response code path the live CLI uses.
  files:
    - hermes/hooks/tests/test_repeated_attempt_guard.py
