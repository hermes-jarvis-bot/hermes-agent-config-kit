- path: hermes/skills/creative/pixel-art-studio/scripts/quality_check.py
  source_repo: AnastasiyaW/claude-code-config
  source_path: skills/creative/pixel-art-studio/scripts/quality_check.py
  source_sha256: 14b1d042604b919444a198088518112150fe1adeba86ef408efad237e51d7be6
  reviewed_at: "2026-08-04"
  reviewed_by: "operator-approved reviewed-script-lane, hermes-agent-config-kit session (independently characterized by a research subagent, then fully read personally before sign-off)"
  summary: >
    Pixel-art quality scoring (orphan pixels, doublies, pillow-shading,
    hue-rotation, over-AA, silhouette metrics; separate cross-frame
    consistency check for animation JSON). stdlib (argparse, json, math,
    sys, collections.Counter, pathlib, typing) plus Pillow and numpy
    (documented external prerequisite). Fully read-only: no network calls,
    no subprocess/os.system/eval/exec, no credential access, and no file
    writes at all beyond stdout. Its nested per-pixel checks are O(H*W) —
    a CPU-time consideration on very large inputs, not a security concern.
  functional_test: >
    Operator-confirmed live execution on 2026-08-04 via `uv run --with
    Pillow --with numpy python3 quality_check.py`: scored a rendered 8x8
    (64x64 upscaled) test sprite with three colors, returning score=100,
    verdict="ship", and correctly populated palette/orphan/doublies/
    pillow-shading/anti-AA/silhouette findings; separately, `--animation`
    on a 2-frame test JSON returned score=100, verdict="ship". A genuine
    UPSTREAM EDGE-CASE BUG was found and is disclosed here rather than
    silently avoided: `detect_block_size()`'s `rng.integers(0, h - block)`
    call raises `ValueError: high <= 0` when an input image's height (or
    width) exactly equals one of the candidate block sizes checked ([32,
    16, 12, 10, 8, 6, 4, 3, 2]) — e.g. a plain, non-upscaled 16x16 PNG
    with no integer-upscale factor. This was hit when testing against a
    4x4-logical sprite rendered at pixel_size=4 (16x16 actual output) and
    did not reproduce against a more typical 8x8-logical sprite rendered
    at pixel_size=8 (64x64 actual, which has headroom above every
    candidate block size). This is upstream's own pre-existing bug, not
    something introduced by this port (only a provenance docstring was
    added, no logic was changed) — it is not fixed here, consistent with
    "ported unmodified after full manual review," but is recorded so a
    future user or reviewer isn't the first to discover it. Workaround:
    avoid running quality_check.py on an image whose exact pixel
    dimensions match a small power-of-two/common block size with no
    upscale factor; render at a size with some headroom (e.g. logical
    grid x8 or more) instead.

- path: hermes/skills/creative/pixel-art-studio/scripts/bake_animation.py
  source_repo: AnastasiyaW/claude-code-config
  source_path: skills/creative/pixel-art-studio/scripts/bake_animation.py
  source_sha256: 217c442235f939914fec407bdc3dfb8f92afb0e82896f8ef9f25e48808020213
  reviewed_at: "2026-08-04"
  reviewed_by: "operator-approved reviewed-script-lane review, hermes-agent-config-kit session; initially rejected (see mappings/rejected-scripts.yaml), then RECONSIDERED and accepted the same day after the operator directed the two modifications below and separately confirmed the Playwright/Chromium/ffmpeg dependency surface"
  summary: >
    Bakes a canvas-rendered HTML animation (opened in a headless Chromium
    browser via Playwright) into WebP/GIF/WebM/MP4/PNG-sequence, by
    stepping the animation's own phase-derived draw function at any
    sampling density and capturing each frame via toDataURL. stdlib
    (argparse, asyncio, base64, io, json, shutil, subprocess, sys,
    pathlib, urllib.parse) plus Pillow and Playwright (documented
    external prerequisite: pip install playwright Pillow; playwright
    install chromium; ffmpeg in PATH for the webm-alpha/mp4 formats).
    Shells out to ffmpeg via subprocess.run() with an argv list (not
    shell=True) for two of the seven output formats — no shell-injection
    risk from that call. No credential access anywhere in the script.
  modifications: >
    Two deliberate changes from the pristine upstream source (source_sha256
    above is the ORIGINAL upstream hash; this ported file differs from it
    by exactly these two changes plus the header docstring, verified via
    a full diff before accepting):
    (1) added `_require_local_url()`, called at the very start of `main()`,
    which rejects any URL whose host is not localhost/127.0.0.1/::1 — this
    closes the original rejection's primary concern (the script would
    otherwise drive a headless browser, execute arbitrary JavaScript, and
    submit ffmpeg jobs against a fully caller-controlled URL with no
    restriction).
    (2) `bake()`'s frame-capture-and-encode body is now wrapped in
    try/finally so the `.bake_{canvas_id}_{period_ms}ms_{fps}fps` temporary
    frame directory is always removed after the run, success or failure —
    upstream never cleaned this up. No other line was touched; the capture
    loop, all five encoders, and the full CLI surface are byte-for-byte
    upstream.
  functional_test: >
    The new `_require_local_url()` guard was unit-tested in isolation
    (extracted logic, no Playwright/Pillow dependency needed) against 7
    cases on 2026-08-04: localhost, 127.0.0.1, and bracketed IPv6 loopback
    (::1) URLs are accepted; a non-local hostname, a non-local HTTPS host,
    a non-http(s) scheme (ftp), and case variation (LOCALHOST) all resolved
    correctly (accepted only the genuinely-local, case-insensitive matches).
    Full end-to-end execution (actually driving headless Chromium via
    Playwright to capture and encode a real animation) was NOT attempted —
    it requires downloading and installing a Chromium binary (a
    substantially heavier one-time dependency install than Pillow/numpy),
    and the two actual modifications above do not touch the capture/encode
    logic itself, which was already fully read and is unchanged from the
    original upstream script. Stated plainly rather than fabricating a
    full-pipeline result.

