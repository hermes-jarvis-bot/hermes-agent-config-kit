- path: hermes/skills/creative/pixel-art-studio/scripts/quality_check.py
  source_repo: AnastasiyaW/claude-code-config
  source_path: skills/creative/pixel-art-studio/scripts/quality_check.py
  source_sha256: 14b1d042604b919444a198088518112150fe1adeba86ef408efad237e51d7be6
  reviewed_at: "2026-08-04"
  reviewed_by: "operator-approved reviewed-script-lane, hermes-agent-config-kit session (independently characterized by a research subagent, then fully read personally before sign-off)"
  summary: >
    Pixel-art quality scoring (orphan pixels, doublies, pillow-shading,
    hue-rotation, over-AA, silhouette metrics; separate cross-frame
    consistency check for animation JSON). stdlib (argparse, json, math,
    sys, collections.Counter, pathlib, typing) plus Pillow and numpy
    (documented external prerequisite). Fully read-only: no network calls,
    no subprocess/os.system/eval/exec, no credential access, and no file
    writes at all beyond stdout. Its nested per-pixel checks are O(H*W) —
    a CPU-time consideration on very large inputs, not a security concern.
  functional_test: >
    Operator-confirmed live execution on 2026-08-04 via `uv run --with
    Pillow --with numpy python3 quality_check.py`: scored a rendered 8x8
    (64x64 upscaled) test sprite with three colors, returning score=100,
    verdict="ship", and correctly populated palette/orphan/doublies/
    pillow-shading/anti-AA/silhouette findings; separately, `--animation`
    on a 2-frame test JSON returned score=100, verdict="ship". A genuine
    UPSTREAM EDGE-CASE BUG was found and is disclosed here rather than
    silently avoided: `detect_block_size()`'s `rng.integers(0, h - block)`
    call raises `ValueError: high <= 0` when an input image's height (or
    width) exactly equals one of the candidate block sizes checked ([32,
    16, 12, 10, 8, 6, 4, 3, 2]) — e.g. a plain, non-upscaled 16x16 PNG
    with no integer-upscale factor. This was hit when testing against a
    4x4-logical sprite rendered at pixel_size=4 (16x16 actual output) and
    did not reproduce against a more typical 8x8-logical sprite rendered
    at pixel_size=8 (64x64 actual, which has headroom above every
    candidate block size). This is upstream's own pre-existing bug, not
    something introduced by this port (only a provenance docstring was
    added, no logic was changed) — it is not fixed here, consistent with
    "ported unmodified after full manual review," but is recorded so a
    future user or reviewer isn't the first to discover it. Workaround:
    avoid running quality_check.py on an image whose exact pixel
    dimensions match a small power-of-two/common block size with no
    upscale factor; render at a size with some headroom (e.g. logical
    grid x8 or more) instead.
