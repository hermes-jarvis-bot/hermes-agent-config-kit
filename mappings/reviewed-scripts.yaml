# Reviewed-script lane (see SECURITY.md "Reviewed-script lane" and AGENTS.md's
# quarantine-policy section for the full policy this manifest implements).
#
# This is the ONLY mechanism by which a skill-bundled script may live under
# hermes/skills/**/scripts/ without failing scripts/validate_output.py's
# quarantine-leak check. Every entry here required, before being added:
#   1. a full manual read of the entire script (not a grep-only pass);
#   2. a dependency check (stdlib preferred; any external dependency is
#      documented as an explicit prerequisite, same as this repo already does
#      for install/apply commands);
#   3. confirmation of no destructive filesystem operations, no credential/
#      secret reads or logging, and no undisclosed network calls;
#   4. a path-portability check (no hardcoded Claude-Code-specific paths such
#      as .claude/ or ~/.claude/, unless kept deliberately as documented
#      upstream-source context);
#   5. `python3 -m py_compile` (or the JS/TS equivalent) passing cleanly;
#   6. for Python/JS, this repo's own automated dangerous-pattern and secret
#      scans (validate_reviewed_scripts() in scripts/validate_output.py)
#      passing cleanly;
#   7. never invoked automatically by this adapter or its CI — only ever
#      invoked by an operator or agent at runtime, under Hermes's own normal
#      permission/consent system, exactly like any other bundled skill script
#      (e.g. Hermes's own official xlsx/pdf/linear skills).
#
# A script here is NEVER auto-converted or auto-regenerated by
# scripts/sync_upstream.py. If the upstream source changes (source_sha256 no
# longer matches upstream), the change must be re-reviewed by hand and this
# entry updated deliberately — the same manual-reapproval discipline this
# adapter already applies to hand-adapted markdown sources.
#
# Every entry below is ported byte-for-byte unmodified except where a
# `modifications` field is present. A modification is only made for a stated,
# citable reason (usually closing a specific security/hygiene gap found during
# review) and is never a silent behavioural change — see the entry's own
# `modifications` text for the exact diff and rationale, and check the
# script's own header docstring, which restates the same thing inline.

